# Local development infrastructure only. Never use these credentials outside a developer machine.
name: workhub-pms

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms_local_dev
      POSTGRES_DB: pms_dev
    ports:
      - "127.0.0.1:${PMS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - pms_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pms_pgdata:
